# Reef Sentinel production stack: Caddy (TLS, HTTP/3) -> Next.js.
#   docker compose --env-file .env up -d --build
name: reefatlas

services:
  web:
    build:
      context: ../apps/web
    image: ${WEB_IMAGE:-reefatlas-web:latest}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - path: ${TIGER_ENV_FILE:-/opt/reefatlas/secrets/tiger.env}
        required: false
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # hardening: immutable filesystem, no privilege escalation, no capabilities
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: &logging
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-reefatlas.us}
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN:-reefatlas.us}}
    volumes:
      # mount the directory, not the file: rsync/editors replace files by rename,
      # which a single-file bind mount would not see
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data # certificates and ACME account: must persist
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
